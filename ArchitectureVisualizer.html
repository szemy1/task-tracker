  <script src="https://unpkg.com/cytoscape@3.24.0/dist/cytoscape.min.js">function filterByType(type) {
  architecture.nodes().forEach(n => {
    const match = n.data('type') === type;
    n.style('display', match ? 'element' : 'none');
  });
  architecture.edges().forEach(e => {
    const srcVisible = architecture.getElementById(e.data('source')).style('display') !== 'none';
    const tgtVisible = architecture.getElementById(e.data('target')).style('display') !== 'none';
    e.style('display', srcVisible && tgtVisible ? 'element' : 'none');
  });
}

function resetFilter() {
  architecture.elements().forEach(e => e.style('display', 'element'));
}
</script>

    logic.on('tap', 'node', evt => {
  const source = evt.target.data('source');
  const archNode = architecture.getElementById(source);

  architecture.nodes().removeClass('highlight');
  architecture.edges().removeClass('highlight');

  if (archNode && archNode.length > 0) {
    archNode.addClass('highlight');

    const connectedEdges = architecture.edges().filter(edge =>
      edge.data('source') === source || edge.data('target') === source
    );

    connectedEdges.forEach(edge => {
      edge.addClass('highlight');
      architecture.getElementById(edge.data('source')).addClass('highlight');
      architecture.getElementById(edge.data('target')).addClass('highlight');
    });
  } else {
    console.warn('Nem található architektúra node ehhez:', source);
  }

  document.getElementById('details').innerHTML = `<strong>${source}</strong>: ${descMap[source] || 'Részlet ehhez a metódushoz.'}`;
});

architecture.on('mouseover', 'node', evt => {
  const tooltip = document.getElementById('tooltip');
  const id = evt.target.id();
  const description = descMap[id] || 'Nincs részletes leírás.';
  tooltip.innerHTML = `<strong>${id}</strong><br>${description}`;
  tooltip.style.display = 'block';
});

architecture.on('mouseout', 'node', () => {
  const tooltip = document.getElementById('tooltip');
  tooltip.style.display = 'none';
});

architecture.on('mousemove', evt => {
  const tooltip = document.getElementById('tooltip');
  tooltip.style.left = (evt.originalEvent.pageX + 10) + 'px';
  tooltip.style.top = (evt.originalEvent.pageY + 10) + 'px';
});

architecture.on('tap', 'node', evt => {
  const id = evt.target.id();
  const flow = logicFlows[id];

  logic.elements().remove();
  logic.nodes().removeClass('highlight');
  logic.edges().removeClass('highlight');

  if (flow) {
    logic.add(flow);
    logic.layout({ name: 'dagre', rankDir: 'TB' }).run();

    flow
      .filter(e => e.data?.source === id && e.data?.id)
      .forEach(e => logic.getElementById(e.data.id).addClass('highlight'));
  } else {
    console.warn('Nincs logikai ábra ehhez:', id);
  }

  document.getElementById('details').innerHTML = `<strong>${id}</strong>: ${descMap[id] || 'Részlet ehhez a komponenshez.'}`;
});
document.getElementById('search').addEventListener('input', e => {
  const query = e.target.value.toLowerCase();
  const allNodes = [...architecture.nodes(), ...logic.nodes()];
  allNodes.forEach(n => {
    const label = n.data('label')?.toLowerCase() || '';
    if (query && label.includes(query)) {
      n.style('opacity', 1);
      n.addClass('highlight');
    } else if (query) {
      n.style('opacity', 0.1);
      n.removeClass('highlight');
    } else {
      n.style('opacity', 1);
      n.removeClass('highlight');
    }
  });
});

function filterByType(type) {
  architecture.nodes().forEach(n => {
    const match = n.data('type') === type;
    n.style('display', match ? 'element' : 'none');
  });
  architecture.edges().forEach(e => {
    const srcVisible = architecture.getElementById(e.data('source')).style('display') !== 'none';
    const tgtVisible = architecture.getElementById(e.data('target')).style('display') !== 'none';
    e.style('display', srcVisible && tgtVisible ? 'element' : 'none');
  });
}

function resetFilter() {
  architecture.elements().forEach(e => e.style('display', 'element'));
}
;
