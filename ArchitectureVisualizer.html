<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeTracker – Teljes rendszer</title>
  <script src="https://unpkg.com/cytoscape@3.24.0/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
  <style>
    html, body { margin: 0; font-family: sans-serif; height: 100%; background: #f4f4f4; }
    h1, h2 { margin: 1rem; }
    .cy-container { height: 40vh; width: 100%; border-bottom: 1px solid #ccc; }
    #details { padding: 1rem; background: #fff; min-height: 10vh; }
  </style>
</head>
<body>
  <h1>TimeTracker – Teljes rendszer (Frontend + Backend + API)</h1>
  <div id="arch" class="cy-container"></div>
  <h2>Működés – Kiválasztott komponens logikája</h2>
  <div id="logic" class="cy-container"></div>
  <div id="details"><strong>Kattints egy elemre a részletekhez...</strong></div>

  <script>
    cytoscape.use(cytoscapeDagre);

    const descMap = {
      MainWindow: "Frontend főablak, UI vezérlés.",
      APIClient: "HTTP kliens a frontendben.",
      FloatingControl: "Kis vezérlő UI.",
      TimerMgr: "Időzítő logika a frontendben.",
      NewDialog: "Új feladat ablak.",
      EditDialog: "Feladat szerkesztő ablak.",
      TaskManager: "Backend logikai réteg, vezérli a storage-t.",
      Storage: "Fájlalapú JSON tárolás, archívum.",
      Router: "FastAPI router, útválasztja az endpointokat.",
      FastAPIApp: "FastAPI alkalmazás objektum.",
      Uvicorn: "Uvicorn szerver (háttér szál).",
      BackendLog: "Log fájl (írás/olvasás).",
      TasksJSON: "Feladatokat tartalmazó JSON fájl.",
      ArchiveJSON: "Archív fájlok (tasks_*.json)."
    };

    const architecture = cytoscape({
      container: document.getElementById('arch'),
      elements: [
        // Frontend
        { data: { id: 'MainWindow', label: 'MainWindow', type: 'frontend' } },
        { data: { id: 'APIClient', label: 'APIClient', type: 'frontend' } },
        { data: { id: 'FloatingControl', label: 'FloatingControl', type: 'frontend' } },
        { data: { id: 'TimerMgr', label: 'TaskTimerManager', type: 'frontend' } },
        { data: { id: 'NewDialog', label: 'NewTaskDialog', type: 'frontend' } },
        { data: { id: 'EditDialog', label: 'EditTaskDialog', type: 'frontend' } },

        // Backend
        { data: { id: 'TaskManager', label: 'TaskManager', type: 'backend' } },
        { data: { id: 'Storage', label: 'Storage', type: 'backend' } },
        { data: { id: 'Router', label: 'API Router', type: 'backend' } },
        { data: { id: 'FastAPIApp', label: 'FastAPI App', type: 'backend' } },
        { data: { id: 'Uvicorn', label: 'Uvicorn Server', type: 'process' } },

        // Fájlok
        { data: { id: 'BackendLog', label: 'backend.log', type: 'file' } },
        { data: { id: 'TasksJSON', label: 'tasks.json', type: 'file' } },
        { data: { id: 'ArchiveJSON', label: 'tasks_*.json', type: 'file' } },

        // Kapcsolatok
        { data: { source: 'MainWindow', target: 'APIClient', label: 'uses' } },
        { data: { source: 'APIClient', target: 'Router', label: 'calls' } },
        { data: { source: 'Router', target: 'TaskManager', label: 'calls' } },
        { data: { source: 'TaskManager', target: 'Storage', label: 'uses' } },
        { data: { source: 'Storage', target: 'TasksJSON', label: 'reads/writes' } },
        { data: { source: 'Storage', target: 'ArchiveJSON', label: 'moves' } },
        { data: { source: 'TaskManager', target: 'BackendLog', label: 'writes' } },
        { data: { source: 'EditDialog', target: 'APIClient', label: 'uses' } },
        { data: { source: 'NewDialog', target: 'APIClient', label: 'uses' } },
        { data: { source: 'FloatingControl', target: 'APIClient', label: 'uses' } },
        { data: { source: 'FloatingControl', target: 'TimerMgr', label: 'controls' } },
        { data: { source: 'MainWindow', target: 'FloatingControl', label: 'creates' } },
        { data: { source: 'MainWindow', target: 'NewDialog', label: 'opens' } },
        { data: { source: 'MainWindow', target: 'EditDialog', label: 'opens' } },
        { data: { source: 'FastAPIApp', target: 'Router', label: 'includes' } },
        { data: { source: 'Uvicorn', target: 'FastAPIApp', label: 'runs' } }
      ],
      layout: { name: 'dagre', rankDir: 'LR' },
      style: [
        {
          selector: 'node',
          style: {
            label: 'data(label)',
            'shape': 'roundrectangle',
            'background-color': ele => {
              const t = ele.data('type');
              return t === 'frontend' ? '#cfc' : t === 'backend' ? '#ccf' : t === 'file' ? '#ffc' : '#eee';
            },
            'border-width': 2,
            'border-color': '#333',
            'text-valign': 'center',
            'text-halign': 'center'
          }
        },
        {
          selector: 'edge',
          style: {
            width: 2,
            'line-color': '#666',
            'target-arrow-shape': 'triangle',
            'target-arrow-color': '#666',
            'curve-style': 'bezier',
            label: 'data(label)',
            'font-size': 10,
            'text-rotation': 'autorotate'
          }
        }
      ]
    });

    const logic = cytoscape({
      container: document.getElementById('logic'),
      elements: [],
      layout: { name: 'dagre', rankDir: 'TB' },
      style: [
        {
          selector: 'node',
          style: {
            label: 'data(label)',
            'shape': 'roundrectangle',
            'background-color': '#e0f7fa',
            'border-width': 2,
            'border-color': '#555',
            'text-valign': 'center',
            'text-halign': 'center'
          }
        },
        {
          selector: 'edge',
          style: {
            width: 2,
            'line-color': '#555',
            'target-arrow-shape': 'triangle',
            'target-arrow-color': '#555',
            'curve-style': 'bezier',
            label: 'data(label)',
            'font-size': 10,
            'text-rotation': 'autorotate'
          }
        }
      ]
    });

    const logicFlows = {
  TimerMgr: [
    { data: { id: 'tm1', label: 'start()', source: 'TimerMgr' } },
    { data: { id: 'tm2', label: 'write log', source: 'BackendLog' } },
    { data: { id: 'tm3', label: 'update UI', source: 'FloatingControl' } },
    { data: { source: 'tm1', target: 'tm2' } },
    { data: { source: 'tm2', target: 'tm3' } }
  ],
  Storage: [
    { data: { id: 'st1', label: 'load()', source: 'Storage' } },
    { data: { id: 'st2', label: 'read tasks.json', source: 'TasksJSON' } },
    { data: { id: 'st3', label: 'archive()', source: 'Storage' } },
    { data: { id: 'st4', label: 'move to archive', source: 'ArchiveJSON' } },
    { data: { source: 'st1', target: 'st2' } },
    { data: { source: 'st3', target: 'st4' } }
  ],
  MainWindow: [
    { data: { id: 'mw1', label: 'init()', source: 'MainWindow' } },
    { data: { id: 'mw2', label: 'load_tasks()', source: 'MainWindow' } },
    { data: { id: 'mw3', label: 'APIClient.get_tasks()', source: 'APIClient' } },
    { data: { id: 'mw4', label: 'render()', source: 'MainWindow' } },
    { data: { source: 'mw1', target: 'mw2' } },
    { data: { source: 'mw2', target: 'mw3' } },
    { data: { source: 'mw3', target: 'mw4' } }
  ],
  APIClient: [
    { data: { id: 'ap1', label: 'get_tasks()', source: 'APIClient' } },
    { data: { id: 'ap2', label: 'send GET /tasks', source: 'APIClient' } },
    { data: { id: 'ap3', label: 'parse response', source: 'APIClient' } },
    { data: { source: 'ap1', target: 'ap2' } },
    { data: { source: 'ap2', target: 'ap3' } }
  ],
  FloatingControl: [
    { data: { id: 'fc1', label: 'on_click()', source: 'FloatingControl' } },
    { data: { id: 'fc2', label: 'check timer state', source: 'FloatingControl' } },
    { data: { id: 'fc3', label: 'TimerMgr.start()', source: 'TimerMgr' } },
    { data: { id: 'fc4', label: 'TimerMgr.stop()', source: 'TimerMgr' } },
    { data: { id: 'fc5', label: 'update UI', source: 'FloatingControl' } },
    { data: { source: 'fc1', target: 'fc2' } },
    { data: { source: 'fc2', target: 'fc3', label: 'if stopped' } },
    { data: { source: 'fc2', target: 'fc4', label: 'if running' } },
    { data: { source: 'fc3', target: 'fc5' } },
    { data: { source: 'fc4', target: 'fc5' } }
  ],
  Router: [
    { data: { id: 'http', label: 'GET /tasks', source: 'Router' } },
    { data: { id: 'callMgr', label: 'TaskManager.get_all_tasks()', source: 'TaskManager' } },
    { data: { id: 'load', label: 'Storage.load()', source: 'Storage' } },
    { data: { source: 'http', target: 'callMgr' } },
    { data: { source: 'callMgr', target: 'load' } }
  ],
  TaskManager: [
    { data: { id: 'getTasks', label: 'get_all_tasks()', source: 'TaskManager' } },
    { data: { id: 'read', label: 'Storage.read()', source: 'Storage' } },
    { data: { id: 'log', label: 'write backend.log', source: 'BackendLog' } },
    { data: { source: 'getTasks', target: 'read' } },
    { data: { source: 'getTasks', target: 'log' } }
  ],
  EditDialog: [
    { data: { id: 'ed1', label: 'open()', source: 'EditDialog' } },
    { data: { id: 'ed2', label: 'fill form', source: 'EditDialog' } },
    { data: { id: 'ed3', label: 'validate()', source: 'EditDialog' } },
    { data: { id: 'ed4', label: 'APIClient.update_task()', source: 'APIClient' } },
    { data: { id: 'ed5', label: 'refresh MainWindow', source: 'MainWindow' } },
    { data: { source: 'ed1', target: 'ed2' } },
    { data: { source: 'ed2', target: 'ed3' } },
    { data: { source: 'ed3', target: 'ed4', label: 'valid' } },
    { data: { source: 'ed4', target: 'ed5' } }
  ],
  NewDialog: [
    { data: { id: 'nd1', label: 'open()', source: 'NewDialog' } },
    { data: { id: 'nd2', label: 'fill form', source: 'NewDialog' } },
    { data: { id: 'nd3', label: 'validate()', source: 'NewDialog' } },
    { data: { id: 'nd4', label: 'APIClient.create_task()', source: 'APIClient' } },
    { data: { id: 'nd5', label: 'refresh MainWindow', source: 'MainWindow' } },
    { data: { source: 'nd1', target: 'nd2' } },
    { data: { source: 'nd2', target: 'nd3' } },
    { data: { source: 'nd3', target: 'nd4', label: 'valid' } },
    { data: { source: 'nd4', target: 'nd5' } }
  ],
  WindowWatcher: [
    { data: { id: 'ww1', label: 'detect window change', source: 'WindowWatcher' } },
    { data: { id: 'ww2', label: 'match task title', source: 'WindowWatcher' } },
    { data: { id: 'ww3', label: 'update FloatingControl', source: 'FloatingControl' } },
    { data: { source: 'ww1', target: 'ww2' } },
    { data: { source: 'ww2', target: 'ww3' } }
  ],
  FastAPIApp: [
    { data: { id: 'fa1', label: 'startup()', source: 'FastAPIApp' } },
    { data: { id: 'fa2', label: 'include router', source: 'Router' } },
    { data: { source: 'fa1', target: 'fa2' } }
  ],
  Uvicorn: [
    { data: { id: 'uv1', label: 'launch process', source: 'Uvicorn' } },
    { data: { id: 'uv2', label: 'run FastAPI app', source: 'FastAPIApp' } },
    { data: { source: 'uv1', target: 'uv2' } }
  ]
};

    architecture.on('tap', 'node', evt => {
      const id = evt.target.id();
      const desc = descMap[id] || 'Nincs leírás.';
      document.getElementById('details').innerHTML = `<strong>${id}</strong>: ${desc}`;

      logic.elements().remove();
      if (logicFlows[id]) {
        logic.add(logicFlows[id]);
        logic.layout({ name: 'dagre', rankDir: 'TB' }).run();
      }
    });

    logic.on('tap', 'node', evt => {
      const source = evt.target.data('source');
      const archNode = architecture.getElementById(source);
      architecture.nodes().unselect();
      if (archNode) archNode.select();
      document.getElementById('details').innerHTML = `<strong>${source}</strong>: ${descMap[source] || 'Részlet ehhez a metódushoz.'}`;
    });
  </script>
</body>
</html>
