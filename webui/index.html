<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gantt Chart</title>
  <!-- Helyi CSS fájl -->
  <link href="vis-timeline.min.css" rel="stylesheet">
  <!-- Helyi JS fájl -->
  <script src="vis-timeline.min.js"></script>
  <script src="qwebchannel.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    #timeline {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="timeline"></div>
  <script>
    const container = document.getElementById('timeline');
    const items = new vis.DataSet([]);

    // Fetch tasks.json dynamically
    fetch('tasks.json')
      .then(response => response.json())
      .then(data => {
        data.forEach(task => {
          items.add({
            id: task.id,
            content: task.name,
            start: task.start,
            end: task.end
          });
        });

        const options = {
          stack: false,
          editable: false,
          margin: {
            item: 10,
            axis: 5
          }
        };

        const timeline = new vis.Timeline(container, items, options);

        // WebChannel integration
        new QWebChannel(qt.webChannelTransport, function(channel) {
          const api = channel.objects.api;
          timeline.on('select', function(properties) {
            const selectedItem = items.get(properties.items[0]);
            if (selectedItem) {
              api.create_subtask({
                name: selectedItem.content,
                start: selectedItem.start,
                end: selectedItem.end
              });
            }
          });
        });
      })
      .catch(error => console.error('Error loading tasks.json:', error));
  </script>
</body>
</html>
